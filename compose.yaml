# Local development only. AWS resources are not provisioned by this file.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: debug_ed
      POSTGRES_USER: debug_ed
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug_ed -d debug_ed"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://debug_ed:local-development-only@db:5432/debug_ed
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
