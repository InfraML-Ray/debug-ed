[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "debug-ed-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.11,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
