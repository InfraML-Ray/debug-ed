name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: debug_ed_test
          POSTGRES_USER: debug_ed
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U debug_ed -d debug_ed_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: demo
      AI_PROVIDER: demo
      DATABASE_URL: sqlite:///./migration-check.db
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://debug_ed:test-only@localhost:5432/debug_ed_test' || '' }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check app tests alembic
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/pip install -c apps/api/requirements.lock -e apps/api
      - run: npm ci
      - run: npm run api:types
      - run: git diff --exit-code -- apps/web/src/lib/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
