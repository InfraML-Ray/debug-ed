name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./migration-check.db
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: ruff check app tests alembic
      - run: pytest -q
      - run: alembic upgrade head
      - run: alembic check
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv apps/api/.venv
      - run: apps/api/.venv/bin/pip install -c apps/api/requirements.lock -e apps/api
      - run: npm ci
      - run: npm run api:types
      - run: git diff --exit-code -- apps/web/src/lib/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
